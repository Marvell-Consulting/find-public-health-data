name: Publish images

# Only main, and only on push: the federated credential in Azure trusts workflow runs from
# this branch alone, so a pull request run could not authenticate even if it were triggered.
# This does not wait on CI. It does not need to: ci.yml's build-images job builds and starts
# these same five images on the pull request, so a Dockerfile or runtime-tree regression is
# already a red gate before merge. What is left here — registry auth, the scan and the push —
# has no pull request equivalent, and an image in the registry that nothing deploys is harmless.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancels: two quick merges must queue rather than race, or `latest` can end up
# pointing at the older of the two.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  ACR_NAME: fphdbetaacr
  REGISTRY: fphdbetaacr.azurecr.io

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Mints the OIDC token azure/login exchanges for an Azure access token. This is the
      # whole of the auth: the workflow holds no registry password and no client secret.
      id-token: write
    strategy:
      # One app failing to build must not stop the other four publishing.
      fail-fast: false
      matrix:
        include:
          - app: public-web
            target: web
          - app: internal-web
            target: web
          - app: public-api
            target: api
          - app: internal-api
            target: api
          - app: operations
            target: operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The three identifiers are not credentials on their own — the federated trust is what
      # authorises — but they are held as secrets because this repository is public and the
      # subscription and tenant should not be enumerable from it.
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Exchanges the Azure token for a short-lived registry token and writes it to the
      # Docker config. The identity behind it holds AcrPush and nothing else.
      - name: Sign in to the container registry
        run: az acr login --name "${ACR_NAME}"

      # The OCI labels are where "which commit is this, and when was it built" belongs. Encoding
      # either into the tag would be the same fact in a place that can drift from it, and the
      # tags are load-bearing: deployments pin the SHA.
      - name: Build the image
        env:
          APP: ${{ matrix.app }}
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/Dockerfile \
            --target "${TARGET}" \
            --build-arg "APP=${APP}" \
            --label "org.opencontainers.image.title=${APP}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${REGISTRY}/${APP}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${APP}:latest" \
            .

      # The layer nothing else covers: CodeQL reads source and CI's audit job resolves the npm
      # tree from the lockfile, so the Debian userland these images are built on — the base
      # image, tini, and psql in the operations image — is otherwise unscanned. Between build
      # and push, so a failing image is never in the registry to be deployed.
      #
      # --pkg-types os is the whole point rather than a narrowing: the npm tree is already gated
      # from the lockfile by CI's audit job, and scanning it here instead fails on npm's own
      # bundled dependencies — the Node image ships an npm whose tar and undici carry fixable
      # highs, which only a new base image fixes and which nothing in these images even runs.
      #
      # --ignore-unfixed because a CVE with no fixed version yet is a red build with nothing to
      # do about it but wait. --scanners vuln keeps the failure legible as "this image has a
      # fixable CVE": anything reaching an image came out of this repository, where secret
      # scanning and push protection already apply.
      - name: Scan the image
        env:
          APP: ${{ matrix.app }}
          # v0.73.0, pinned by digest for the same reason the actions above are.
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY_IMAGE}" image \
              --scanners vuln \
              --pkg-types os \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${APP}:${GITHUB_SHA}"

      # The commit SHA is what deployments pin to; `latest` is a convenience for pulling by
      # hand and must never be what a revision references.
      - name: Push the image
        env:
          APP: ${{ matrix.app }}
        run: |
          docker push "${REGISTRY}/${APP}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${APP}:latest"
