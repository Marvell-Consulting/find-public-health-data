name: Publish images

# Only main, and only on push — the federated credential in Azure trusts runs from this
# branch alone. It doesn't wait on CI: build-images already gates image regressions on the
# pull request, and what's left here (auth, scan, push) has no pull request equivalent.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancels: two quick merges must queue rather than race, or `latest` can end up
# pointing at the older of the two.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  ACR_NAME: fphdbetaacr
  REGISTRY: fphdbetaacr.azurecr.io

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Mints the OIDC token azure/login exchanges for an Azure access token. This is the
      # whole of the auth: the workflow holds no registry password and no client secret.
      id-token: write
    strategy:
      # One app failing to build must not stop the other four publishing.
      fail-fast: false
      matrix:
        include:
          - app: public-web
            target: web
          - app: internal-web
            target: web
          - app: public-api
            target: api
          - app: internal-api
            target: api
          - app: operations
            target: operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The three identifiers are not credentials on their own — the federated trust is what
      # authorises — but they are held as secrets because this repository is public and the
      # subscription and tenant should not be enumerable from it.
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Exchanges the Azure token for a short-lived registry token and writes it to the
      # Docker config. The identity behind it holds AcrPush and nothing else.
      - name: Sign in to the container registry
        run: az acr login --name "${ACR_NAME}"

      # Commit and build-time metadata go in the OCI labels, not the tags — a tag encoding
      # them could drift from the truth the labels carry.
      - name: Build the image
        env:
          APP: ${{ matrix.app }}
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/Dockerfile \
            --target "${TARGET}" \
            --build-arg "APP=${APP}" \
            --label "org.opencontainers.image.title=${APP}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${REGISTRY}/${APP}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${APP}:latest" \
            .

      # Runs between build and push, so a failing image is never in the registry to be deployed.
      # ci.yml runs the same scan on pull requests; this one gates what actually ships.
      #
      # OS packages only: the npm tree is already audited from the lockfile in CI, and scanning
      # it here would fail on npm's own bundled dependencies — which nothing in these images runs
      # and only a new base image fixes. ignore-unfixed because a CVE with no fix yet is a red
      # build with nothing to do about it but wait. The action rather than a trivy image so the
      # engine sits under Dependabot's actions updater; pinning `version:` would undo that.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          scanners: vuln
          # The action has not renamed this input yet; it sets TRIVY_PKG_TYPES.
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Both tags are labels for humans, not what a deployment should reference: ACR tags are
      # mutable, and re-running this workflow for the same commit produces a different manifest
      # that overwrites both. The digest below is the immutable reference.
      - name: Push the image
        id: push
        env:
          APP: ${{ matrix.app }}
        run: |
          # `docker push` reports the manifest the registry stored as `<tag>: digest: sha256:…`.
          # Read it from the push rather than from the local image: it is the registry's own
          # answer to what now exists under this tag.
          push_output=$(docker push "${REGISTRY}/${APP}:${GITHUB_SHA}" | tee /dev/stderr)
          docker push "${REGISTRY}/${APP}:latest"

          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<<"${push_output}" | head -1)
          if [ -z "${digest}" ]; then
            echo '::error::Could not read the pushed manifest digest'
            exit 1
          fi
          echo "reference=${REGISTRY}/${APP}@${digest}" >> "${GITHUB_OUTPUT}"

      # Deploys are manual for now; the run summary puts the digest where a person can find
      # it without digging through logs.
      - name: Record the deployable reference
        env:
          APP: ${{ matrix.app }}
          REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          {
            echo "### ${APP}"
            echo
            echo '```'
            echo "${REFERENCE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
