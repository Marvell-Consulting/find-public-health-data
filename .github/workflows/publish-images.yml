name: Publish images

# Only main, and only on push — these packages are what deployments pull, so only merged
# code publishes to them. It doesn't wait on CI: build-images already gates image
# regressions on the pull request, and what's left here (auth, scan, push) has no pull
# request equivalent.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancels: two quick merges must queue rather than race, or `latest` can end up
# pointing at the older of the two.
concurrency:
  group: publish-images
  cancel-in-progress: false

# Repo-prefixed so a generic name like `operations` isn't loose in the organisation namespace;
# lowercase because image references must be. The packages are linked to this repository and
# inherit its permissions because their first push comes from this workflow's token — the
# prefix alone does nothing. They are public, so deployments pull anonymously, but GHCR
# creates each package private: a new one must be flipped to public by hand before anything
# can pull it.
env:
  REGISTRY: ghcr.io/marvell-consulting/find-public-health-data

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The run's own GITHUB_TOKEN is the whole of the auth: no PAT, no stored secret,
      # and the token expires with the run.
      packages: write
    strategy:
      # One app failing to build must not stop the other four publishing.
      fail-fast: false
      matrix:
        include:
          - app: public-web
            target: web
          - app: internal-web
            target: web
          - app: public-api
            target: api
          - app: internal-api
            target: api
          - app: operations
            target: operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to the container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"

      # Commit and build-time metadata go in the OCI labels, not the tags — a tag encoding
      # them could drift from the truth the labels carry.
      - name: Build the image
        env:
          APP: ${{ matrix.app }}
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/Dockerfile \
            --target "${TARGET}" \
            --build-arg "APP=${APP}" \
            --label "org.opencontainers.image.title=${APP}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${REGISTRY}/${APP}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${APP}:latest" \
            .

      # Runs between build and push, so a failing image is never in the registry to be deployed.
      # ci.yml runs the same scan on pull requests; this one gates what actually ships.
      #
      # OS packages only: the npm tree is already audited from the lockfile in CI, and scanning
      # it here would fail on npm's own bundled dependencies — which nothing in these images runs
      # and only a new base image fixes. ignore-unfixed because a CVE with no fix yet is a red
      # build with nothing to do about it but wait. The action rather than a trivy image so the
      # engine sits under Dependabot's actions updater; pinning `version:` would undo that.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          scanners: vuln
          # The action has not renamed this input yet; it sets TRIVY_PKG_TYPES.
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # The packages are public, so a secret in a layer is published. Separate from the
      # vulnerability scan because its HIGH,CRITICAL floor would hide Trivy's generic credential
      # patterns. check:artefacts already blocks the route in; this checks the bytes.
      - name: Scan the image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          scanners: secret
          exit-code: 1
        env:
          # Build args and ENV land in the image config, not in a file; the default scan reads files only.
          TRIVY_IMAGE_CONFIG_SCANNERS: secret

      # Both tags are labels for humans, not what a deployment should reference: GHCR tags are
      # mutable, and re-running this workflow for the same commit produces a different manifest
      # that overwrites both. The digest below is the immutable reference.
      - name: Push the image
        id: push
        env:
          APP: ${{ matrix.app }}
        run: |
          # `docker push` reports the manifest the registry stored as `<tag>: digest: sha256:…`.
          # Read it from the push rather than from the local image: it is the registry's own
          # answer to what now exists under this tag.
          push_output=$(docker push "${REGISTRY}/${APP}:${GITHUB_SHA}" | tee /dev/stderr)
          docker push "${REGISTRY}/${APP}:latest"

          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<<"${push_output}" | head -1)
          if [ -z "${digest}" ]; then
            echo '::error::Could not read the pushed manifest digest'
            exit 1
          fi
          echo "reference=${REGISTRY}/${APP}@${digest}" >> "${GITHUB_OUTPUT}"

      # Deploys are manual for now; the run summary puts the digest where a person can find
      # it without digging through logs.
      - name: Record the deployable reference
        env:
          APP: ${{ matrix.app }}
          REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          {
            echo "### ${APP}"
            echo
            echo '```'
            echo "${REFERENCE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # One Slack message per run, never one per matrix leg. Per-app conclusions come
  # from the jobs API because needs.publish.result collapses the matrix to one
  # value — and the partial publish (fail-fast: false) is the case worth spelling
  # out, since the registry is then a mixed set under `latest`.
  notify:
    name: Notify publish outcome
    needs: [publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # For reading this run's jobs.
      actions: read
    steps:
      # Through env and jq, never interpolated: the text carries the commit message.
      - name: Compose the message
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Publish ")) | {app: (.name | ltrimstr("Publish ")), conclusion}]')
          total=$(jq length <<<"${jobs}")
          published=$(jq '[.[] | select(.conclusion == "success")] | length' <<<"${jobs}")
          if [ "${total}" -eq 0 ]; then
            echo '::error::found no publish jobs in this run'
            exit 1
          fi
          mixed=''
          if [ "${published}" -eq "${total}" ]; then
            headline=":white_check_mark: Published all ${total} images"
          elif [ "${published}" -eq 0 ]; then
            headline=":x: Publish failed — no images pushed"
          else
            headline=":warning: PARTIAL publish (${published}/${total})"
            mixed=" — \`latest\` is now a mixed set"
          fi
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          text="${headline} for \`${GITHUB_SHA}\` ${subject}${mixed} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
          text+=$'\n'"$(jq -r '.[] | "• \(.app): \(.conclusion)"' <<<"${jobs}")"
          jq --null-input --arg text "${text}" '{text: $text}' > "${RUNNER_TEMP}/slack-payload.json"

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          # Fail the job if the post fails — a silent channel must not look healthy.
          errors: true
