name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs — two quick merges must not leave main without a green run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # `biome ci` covers the same ground as the `biome check .` in `pnpm check` (format + lint +
      # import order) but never writes and annotates the diff. `pnpm lint` is lint only, so it would
      # let formatting drift onto main ungated.
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Not `pnpm test` — that runs all three tiers, which is right locally and wrong here, where
      # each tier is its own job.
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fphd -d fphd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # The grant migrations reference the per-API roles, so they must exist before the global
      # setup migrates the template databases. Same command locally (`pnpm db:bootstrap`) and
      # in a deployed environment — this is the only bootstrap path.
      - name: Create the per-API login roles
        run: pnpm --filter @fphd/operations cli db bootstrap
        env:
          APP_ENV: test
          DB_HOST: localhost
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
      # One root Vitest run across every project, filtered to paths containing `integration.test`
      # (any extension) — it passes on --passWithNoTests, not because nothing ran. The global
      # setup builds a migrated, seeded template database; each test file copies it, so files
      # run in parallel against isolated databases.
      - run: pnpm test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-api's config requires it at import; CI-only value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes

  e2e:
    name: E2E tests (none defined yet)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # No e2e package exists yet, so this exits 0 having run nothing. See the README.
      - run: pnpm test:e2e

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      # pnpm audit resolves the tree from pnpm-lock.yaml, so this job never installs — and so the
      # job that hunts for malicious dependencies never executes one. (Every installing job runs
      # esbuild's postinstall, per `allowBuilds` in pnpm-workspace.yaml.)
      # Deliberately no --ignore-registry-errors: a registry outage must redden the gate rather than
      # silently pass it.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  compile:
    name: Compile apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  # Distinct from `compile`, which only proves the workspace builds. This proves the artefact that
  # actually ships assembles and starts: `pnpm deploy --prod --legacy` prunes devDependencies, so a
  # module imported at runtime but declared as a devDependency compiles here and is missing there.
  # Without this the first sign of that is a red publish after merge, or a crash-looping revision.
  #
  # No registry login — the images are built into the local daemon and discarded. The Trivy scan
  # mirrors the one in publish-images.yml, where the settings are explained: a failure means a
  # vulnerability apt could not deliver, surfaced here before merge rather than as a red publish
  # after it.
  build-images:
    name: Build images (${{ matrix.app }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One image failing to build must not mask the state of the other four.
      fail-fast: false
      # Mirrors the matrix in publish-images.yml; both need a row when an app is added, as does
      # the `case` guard on APP in docker/Dockerfile.
      matrix:
        include:
          - app: public-web
            target: web
          - app: internal-web
            target: web
          - app: public-api
            target: api
          - app: internal-api
            target: api
          - app: operations
            target: operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Scoped per app rather than shared: the five jobs run concurrently, and one scope would have
      # them overwriting each other's manifest for no gain. Run-over-run is where the saving is —
      # the install and workspace build restore from the previous run of the same app. `mode=max`
      # keeps the builder stage's layers, which are the expensive ones; the cache is well within
      # the repository limit at five scopes, and GitHub evicts least-recently-used beyond it.
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          tags: fphd-ci/${{ matrix.app }}:ci
          # Into the local daemon, not a registry — the smoke test below runs it.
          load: true
          push: false
          # The docker exporter `load` uses cannot carry attestations, and buildx warns rather
          # than failing if asked for them.
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.app }}

      - name: Smoke test ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          IMAGE: fphd-ci/${{ matrix.app }}:ci
        run: |
          # Enough to satisfy every app's schema; unknown keys are ignored by the one reading it.
          # DB_HOST is deliberately unroutable — the servers connect lazily, so a reachable
          # database would prove nothing more and a service container would cost a minute an image.
          env_args=(
            -e APP_ENV=dev
            -e DB_HOST=127.0.0.1
            -e DB_TLS=false
            -e POSTGRES_DB=fphd
            -e POSTGRES_USER=fphd
            -e POSTGRES_PASSWORD=smoke-test-only
            -e PUBLIC_API_PASSWORD=smoke-test-only
            -e INTERNAL_API_PASSWORD=smoke-test-only
            -e SESSION_JWT_SECRET=smoke-test-only-jwt-secret-at-least-32-bytes
          )

          if [ "${APP}" = 'operations' ]; then
            # Bare, the CLI prints its usage and exits 2. Reaching that means config.ts and every
            # module behind it resolved out of the pruned tree.
            status=0
            output=$(docker run --rm "${env_args[@]}" "${IMAGE}" 2>&1) || status=$?
            echo "${output}"
            if [ "${status}" -ne 2 ]; then
              echo "::error::${APP} exited ${status}, expected 2 (usage)"
              exit 1
            fi
            if ! grep -q 'Usage: operations' <<<"${output}"; then
              echo "::error::${APP} did not print its usage"
              exit 1
            fi
            exit 0
          fi

          # Every server logs `Listening` once bound. A module missing from the pruned tree fails
          # well before that, with ERR_MODULE_NOT_FOUND.
          cid=$(docker run -d "${env_args[@]}" "${IMAGE}")
          for _ in $(seq 1 30); do
            if docker logs "${cid}" 2>&1 | grep -q '"msg":"Listening"'; then break; fi
            sleep 1
          done
          logs=$(docker logs "${cid}" 2>&1)
          docker rm -f "${cid}" > /dev/null
          echo "${logs}"
          if ! grep -q '"msg":"Listening"' <<<"${logs}"; then
            echo "::error::${APP} did not start"
            exit 1
          fi

      # After the smoke test, so a scan finding never masks an image that fails to start.
      - name: Scan ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fphd-ci/${{ matrix.app }}:ci
          scanners: vuln
          # The action has not renamed this input yet; it sets TRIVY_PKG_TYPES.
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  artefact-boundary:
    name: Public artefact boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Builds the public artefacts itself, so it does not depend on the compile job — keeping the
      # two jobs parallel, and keeping the check runnable standalone from a clean tree.
      - run: pnpm check:artefacts

  all-checks-pass:
    name: All checks pass
    # The only required status check in branch protection. Add every new job here — the gate can
    # only report on what it depends on.
    needs: [lint, typecheck, unit, integration, e2e, audit, compile, build-images, artefact-boundary]
    # `always()` so a failing need reddens the gate rather than skipping it — GitHub reports a
    # skipped required check as satisfied, so the default `success()` would stop the gate blocking
    # exactly when it matters.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Passed through env rather than interpolated into the shell body: `needs.*.result` is a
      # trusted enumerated value, but inlining `${{ }}` in `run:` is the habit that goes wrong the
      # day it is copied to an untrusted one.
      - name: Check upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo '::error::The gate depends on no jobs; nothing was verified.'
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" != 'success' ]; then
              echo '::error::A required check did not succeed.'
              exit 1
            fi
          done

  # The two Slack jobs run only on push to main: the webhook secret must never be
  # available to pull_request jobs. Neither joins all-checks-pass's needs — they
  # gate nothing, and would sit skipped (not success) on the runs the gate checks.
  notify-merge:
    name: Notify merge
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No needs, so the message posts when the run starts, not when it finishes.
      - name: Compose the message
        id: message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
        run: |
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          echo "text=*${GITHUB_REPOSITORY#*/}* main: <${COMMIT_URL}|${subject}> (${ACTOR})" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ${{ steps.message.outputs.text }}

  notify-ci-failure:
    name: Notify CI failure
    needs: [all-checks-pass]
    # Success is silent — the merge message already said the commit landed.
    if: ${{ always() && github.event_name == 'push' && needs.all-checks-pass.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose the message
        id: message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          echo "text=:x: *${GITHUB_REPOSITORY#*/}* CI failed on main: ${subject} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: ${{ steps.message.outputs.text }}
