name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs — two quick merges must not leave main without a green run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # `biome ci` covers the same ground as the `biome check .` in `pnpm check` (format + lint +
      # import order) but never writes and annotates the diff. `pnpm lint` is lint only, so it would
      # let formatting drift onto main ungated.
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Not `pnpm test` — that runs all three tiers, which is right locally and wrong here, where
      # each tier is its own job.
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fphd -d fphd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # The grant migrations reference the per-API roles, so they must exist before the global
      # setup migrates the template databases. Same command locally (`pnpm db:bootstrap`) and
      # in a deployed environment — this is the only bootstrap path.
      - name: Create the per-API login roles
        run: pnpm --filter @fphd/operations cli db bootstrap
        env:
          APP_ENV: test
          DB_HOST: localhost
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
      # One root Vitest run across every project, filtered to paths containing `integration.test`
      # (any extension) — it passes on --passWithNoTests, not because nothing ran. The global
      # setup builds a migrated, seeded template database; each test file copies it, so files
      # run in parallel against isolated databases.
      - run: pnpm test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-api's config requires it at import; CI-only value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes

  e2e:
    name: E2E tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Covers the uncached compose image build on top of the suite itself.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      # Reads the version pnpm actually installed rather than re-parsing the catalog entry, so a
      # reformatted pnpm-workspace.yaml can't silently break the cache key.
      - name: Read the installed Playwright version
        id: playwright-version
        run: |
          version=$(pnpm --filter @fphd/e2e exec playwright --version | sed -E 's/^Version //')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      # Skips the download on a cache hit but still installs the OS packages, which
      # live outside the cached directory.
      - name: Install Chromium
        run: pnpm --filter @fphd/e2e exec playwright install --with-deps chromium

      # The same development images and profiles scripts/dev.sh uses, built uncached: they
      # share no Dockerfile instructions with build-images' production images, so borrowing
      # that job's cache would hit nothing, and all four builds share every layer up to
      # `ARG APP` through the daemon's local cache. The healthchecks make --wait a real
      # readiness gate. APP_ENV=test rather than local so the TLS-to-database default stays
      # off (isDeployedEnv is false for both) while container logs stay JSON.
      - name: Start the stack
        env:
          APP_ENV: test
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          POSTGRES_DB: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
          # internal-web and internal-api must share it for sessions to verify; CI-only
          # value, not a secret.
          SESSION_JWT_SECRET: ci-only-jwt-session-secret-at-least-32-bytes
        run: >
          docker compose
          --profile public-web --profile internal-web
          --profile public-api --profile internal-api
          up --detach --build --wait

      # The same commands a developer runs, from the host against the compose database.
      - name: Seed the database
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: fphd
          POSTGRES_USER: fphd
          POSTGRES_PASSWORD: fphd
          PUBLIC_API_PASSWORD: public_api
          INTERNAL_API_PASSWORD: internal_api
        run: pnpm db:bootstrap && pnpm db:migrate && pnpm db:import-core-data && pnpm db:seed-dummy-data

      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      # pnpm audit resolves the tree from pnpm-lock.yaml, so this job never installs — and so the
      # job that hunts for malicious dependencies never executes one. (Every installing job runs
      # esbuild's postinstall, per `allowBuilds` in pnpm-workspace.yaml.)
      # Deliberately no --ignore-registry-errors: a registry outage must redden the gate rather than
      # silently pass it.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  compile:
    name: Compile apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  # Distinct from `compile`, which only proves the workspace builds. This proves the artefact that
  # actually ships assembles and starts: `pnpm deploy --prod --legacy` prunes devDependencies, so a
  # module imported at runtime but declared as a devDependency compiles here and is missing there.
  # Without this the first sign of that is a red publish after merge, or a crash-looping revision.
  #
  # No registry login — the images are built into the local daemon and discarded. Build, smoke test
  # and scan are the same three steps publish-images.yml runs, through the same action and script,
  # so a regression reddens the pull request rather than the publish after it.
  build-images:
    name: Build images (${{ matrix.app }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One image failing to build must not mask the state of the other four.
      fail-fast: false
      # Mirrors the matrix in publish-images.yml; both need a row when an app is added.
      matrix:
        include:
          - app: public-web
            target: web
          - app: internal-web
            target: web
          - app: public-api
            target: api
          - app: internal-api
            target: api
          - app: operations
            target: operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.app }}
        uses: ./.github/actions/build-image
        with:
          app: ${{ matrix.app }}
          target: ${{ matrix.target }}
          tags: fphd-ci/${{ matrix.app }}:ci
          cache-scope: images-${{ matrix.app }}

      - name: Smoke test ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
        run: scripts/smoke-image.sh "${APP}" "fphd-ci/${APP}:ci"

      # After the smoke test, so a scan finding never masks an image that fails to start.
      - name: Scan ${{ matrix.app }}
        uses: ./.github/actions/scan-image
        with:
          image-ref: fphd-ci/${{ matrix.app }}:ci

  artefact-boundary:
    name: Public artefact boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Builds the public artefacts itself, so it does not depend on the compile job — keeping the
      # two jobs parallel, and keeping the check runnable standalone from a clean tree.
      - run: pnpm check:artefacts

  all-checks-pass:
    name: All checks pass
    # The only required status check in branch protection. Add every new job here — the gate can
    # only report on what it depends on.
    needs: [lint, typecheck, unit, integration, e2e, audit, compile, build-images, artefact-boundary]
    # `always()` so a failing need reddens the gate rather than skipping it — GitHub reports a
    # skipped required check as satisfied, so the default `success()` would stop the gate blocking
    # exactly when it matters.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Passed through env rather than interpolated into the shell body: `needs.*.result` is a
      # trusted enumerated value, but inlining `${{ }}` in `run:` is the habit that goes wrong the
      # day it is copied to an untrusted one.
      - name: Check upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo '::error::The gate depends on no jobs; nothing was verified.'
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" != 'success' ]; then
              echo '::error::A required check did not succeed.'
              exit 1
            fi
          done

  # Runs only on push to main: the webhook secret must never be available to
  # pull_request jobs. Not in all-checks-pass's needs — it gates nothing, and
  # would sit skipped (not success) on the runs the gate checks.
  notify-ci-failure:
    name: Notify CI failure
    needs: [all-checks-pass]
    # Success is silent — a green run on main is the expected state, and the
    # publish run posts the message that marks the commit landing.
    if: ${{ always() && github.event_name == 'push' && needs.all-checks-pass.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Through env and jq, never interpolated: the text carries the commit message.
      - name: Compose the message
        env:
          RESULT: ${{ needs.all-checks-pass.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "${RESULT}" in
            cancelled) icon=":warning:" ;;
            *) icon=":x:" ;;
          esac
          subject=${COMMIT_MESSAGE%%$'\n'*}
          subject=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"${subject}")
          text="${icon} *${GITHUB_REPOSITORY#*/}* CI on main: ${RESULT} — ${subject} — <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
          jq --null-input --arg text "${text}" '{text: $text}' > "${RUNNER_TEMP}/slack-payload.json"

      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          # Fail the job if the post fails — a silent channel must not look healthy.
          errors: true
