name: Build image
description: Builds one app's production image into the local Docker daemon.

# One build definition for both workflows: ci.yml on the pull request, publish-images.yml on
# the push to main. It loads the image into the local daemon and never pushes, so the caller
# can smoke-test and scan it first; publish-images.yml then pushes the tags this produced.

inputs:
  app:
    description: The app to build; also the APP build arg.
    required: true
  target:
    description: The Dockerfile stage — api, web or operations.
    required: true
  tags:
    description: Tags to apply, one per line.
    required: true
  labels:
    description: OCI labels, one per line. Only a published image carries them.
    required: false
    default: ''
  cache-scope:
    description: >-
      GitHub Actions cache scope to read and write. Empty builds without a cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # One cache scope per app: the matrix legs run concurrently and would overwrite a shared
    # scope's manifest. The saving is run over run, where the install and workspace build restore
    # from the previous run of the same app. `mode=max` keeps the builder stage's layers, which
    # are the expensive ones. Five scopes fit within the repository cache limit; GitHub evicts
    # least recently used beyond it.
    - name: Build ${{ inputs.app }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: docker/Dockerfile
        target: ${{ inputs.target }}
        build-args: APP=${{ inputs.app }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        # Into the local daemon, not a registry.
        load: true
        push: false
        # The docker exporter that `load` uses cannot carry buildx attestations; if asked for
        # them, buildx warns and drops them.
        provenance: false
        cache-from: ${{ inputs.cache-scope && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
        cache-to: ${{ inputs.cache-scope && format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}
