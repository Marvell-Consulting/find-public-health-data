name: Scan image
description: Trivy scans a built image — OS vulnerabilities, then secrets — and fails on findings.

# One definition for the two workflows that scan: ci.yml on the pull request, publish-images.yml
# before the push. The trivy action rather than a trivy image so the engine sits under
# Dependabot's actions updater; pinning `version:` would undo that.

inputs:
  image-ref:
    description: The image reference to scan.
    required: true

runs:
  using: composite
  steps:
    # OS packages only: the npm tree is already audited from the lockfile in CI, and scanning
    # it here would fail on npm's own bundled dependencies — which nothing in these images runs
    # and only a new base image fixes. ignore-unfixed because a CVE with no fix yet is a red
    # build with nothing to do about it but wait.
    - name: Scan for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        # The action has not renamed this input yet; it sets TRIVY_PKG_TYPES.
        vuln-type: os
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1

    # The images are public, so a secret in a layer is published. A separate step because the
    # vulnerability scan's HIGH,CRITICAL floor would hide Trivy's generic credential patterns.
    # check:artefacts already blocks the route in; this checks the bytes.
    - name: Scan for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: secret
        exit-code: 1
      env:
        # Build args and ENV land in the image config, not in a file; the default scan reads files only.
        TRIVY_IMAGE_CONFIG_SCANNERS: secret
