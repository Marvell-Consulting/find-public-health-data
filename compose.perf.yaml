# CI only: the database settings tools/perf needs, layered over compose.yaml and compose.e2e.yaml
# by ci.yml's performance job. pg_stat_statements must be preloaded to count each route's work;
# parallel query off and autovacuum off keep those counts the same from run to run.
services:
  db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum=off
