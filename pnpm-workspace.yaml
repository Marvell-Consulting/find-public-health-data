packages:
  - apps/*
  - packages/*
  - tools/*

overrides:
  # GHSA postcss <=8.5.17 source-map path traversal; transitive via vite.
  postcss: '>=8.5.18'
  # GHSA-2v37-7h3g-55p8 nanoid <3.3.17 unbounded loop on a zero size. Scoped to postcss, the
  # only package that resolves nanoid here, and capped below 4 because postcss requires it as
  # CommonJS and nanoid 4 and up are ESM-only.
  'postcss>nanoid': '>=3.3.17 <4'
  # GHSA-4cwx-7wf7-3272 undici >=7.0.0 <7.29.0 cross-user information disclosure; transitive via jsdom.
  undici: '>=7.29.0 <8'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@biomejs/biome': 2.5.5
  '@not-govuk/button': 0.18.1
  '@not-govuk/inset-text': 0.18.1
  '@not-govuk/link': 0.18.1
  '@not-govuk/page': 0.18.1
  '@not-govuk/radios': 0.18.1
  '@not-govuk/sass-base': 0.18.1
  '@not-govuk/search-box': 0.18.1
  '@react-router/dev': 8.3.0
  '@react-router/express': 8.3.0
  '@react-router/node': 8.3.0
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.2
  '@types/express': 5.0.6
  '@types/govuk-frontend': 5.11.0
  # Match the minimum supported Node runtime; newer Node APIs must not enter accidentally.
  '@types/node': 24.13.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@types/compression': 1.8.1
  '@types/morgan': 1.9.10
  '@types/supertest': 7.2.0
  '@vitejs/plugin-react': 6.0.3
  compression: 1.8.1
  cross-env: 10.1.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  express: 5.2.1
  express-rate-limit: 8.6.0
  govuk-frontend: 5.14.0
  isbot: 5.2.0
  jsdom: 29.1.1
  jose: 6.2.4
  morgan: 1.11.0
